apiVersion: apps/v1
kind: Deployment

metadata:
  name: devsecops-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops-demo

  template:
    metadata:
      labels:
        app: devsecops-demo

    spec:
      containers:
        - name: devsecops-demo
          image: devsecops-demo:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000